name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build:www

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r mobile/android-res/* android/app/src/main/res/

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../pokemon-lakehouse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-lakehouse-apk
          path: pokemon-lakehouse.apk

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Pokémon Lakehouse for Android (latest build)
          body: |
            Latest Android build of Pokémon Lakehouse, built automatically from `main` (${{ github.sha }}).

            **Install:** download `pokemon-lakehouse.apk` on your Android phone and open it. Allow "install unknown apps" for your browser when asked.
          prerelease: false
          make_latest: true
          files: pokemon-lakehouse.apk
